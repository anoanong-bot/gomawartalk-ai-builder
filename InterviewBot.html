<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고마워톡 AI 캠페인 기획 인터뷰 &amp; 무엇이든 물어보세요 챗봇</title>

<!-- 일반 <script src> 로드 (file:// 더블클릭 100% 호환, API 키 절대 미포함) -->
<script src="engines/ImageCapturer.js"></script>
<script src="engines/RagInterviewEngine.js"></script>
<script src="data/GomawartalkManual.js"></script>
<script src="data/IndustryPresets.js"></script>

<style>
:root{
  --purple:#6D28D9; --purple-md:#7C3AED; --purple-dk:#4C1D95; --purple-lt:#F5F3FF; --purple-bd:#DDD6FE;
  --green:#059669; --green-lt:#ECFDF5; --green-bd:#A7F3D0;
  --amber:#D97706; --amber-lt:#FFFBEB; --amber-bd:#FDE68A;
  --g50:#F8FAFC; --g100:#F1F5F9; --g200:#E2E8F0; --g300:#CBD5E1; --g400:#94A3B8; --g500:#64748B; --g700:#334155; --g900:#0F172A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(160deg,#EEF2FF 0%,#F8FAFC 45%,#F5F3FF 100%);color:var(--g700);min-height:100vh;display:flex;justify-content:center;padding:18px 12px;word-break:keep-all}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:.15s}
input,textarea{font-family:inherit;font-size:13.5px;color:var(--g900)}

.shell{width:100%;max-width:780px;height:calc(100vh - 36px);min-height:620px;background:#fff;border:1px solid var(--g200);border-radius:22px;box-shadow:0 20px 50px -16px rgba(15,23,42,.18);display:flex;flex-direction:column;overflow:hidden}

/* 상단 헤더 */
.hdr{padding:16px 22px;background:linear-gradient(135deg,#6D28D9 0%,#4F46E5 100%);color:#fff;display:flex;align-items:center;gap:12px}
.hdr-av{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.hdr-t h1{font-size:16px;font-weight:800;letter-spacing:-.3px}
.hdr-t p{font-size:11.5px;opacity:.9;margin-top:2px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-btn{padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-size:11.5px;font-weight:700;border:1px solid rgba(255,255,255,.28)}
.hdr-btn:hover{background:rgba(255,255,255,.28)}

/* 진행률 & 상시 상담 배너 */
.prog-wrap{padding:10px 20px;background:var(--g50);border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog-bar{flex:1;min-width:160px;height:7px;background:var(--g200);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#7C3AED,#4F46E5);border-radius:99px;transition:width .35s ease}
.prog-lbl{font-size:11.5px;font-weight:800;color:var(--purple);white-space:nowrap}
.qa-tip{padding:8px 20px;background:#FFFBEB;border-bottom:1px solid var(--amber-bd);font-size:12px;color:#92400E;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qa-chips{display:flex;gap:5px;flex-wrap:wrap}
.qa-chip{padding:3px 9px;border-radius:99px;background:#fff;border:1px solid var(--amber-bd);color:#92400E;font-size:11px;font-weight:700}
.qa-chip:hover{background:#FEF3C7}

/* 채팅 영역 */
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#FAFBFD}
#chat::-webkit-scrollbar{width:6px} #chat::-webkit-scrollbar-thumb{background:var(--g200);border-radius:99px}
.msg{display:flex;gap:10px;max-width:90%;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:32px;height:32px;border-radius:11px;background:var(--purple-lt);color:var(--purple);display:grid;place-items:center;font-size:15px;flex-shrink:0;border:1px solid var(--purple-bd)}
.bubble{padding:13px 16px;border-radius:16px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.msg.bot .bubble{background:#fff;border:1px solid var(--g200);border-top-left-radius:4px;color:var(--g900)}
.msg.bot.rag .bubble{background:linear-gradient(180deg,#F5F3FF,#fff);border-color:var(--purple-bd)}
.msg.user .bubble{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border-top-right-radius:4px}
.rag-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--purple);color:#fff;margin-bottom:6px}

/* 인터랙티브 카드 (단계별 버튼/트랙/업로드/제출) */
.widget{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.opt-grid{grid-template-columns:1fr}}
.opt-btn{text-align:left;padding:11px 14px;border-radius:11px;background:var(--g50);border:1.5px solid var(--g200);font-size:12.5px;font-weight:700;color:var(--g900);line-height:1.45}
.opt-btn:hover{border-color:var(--purple-md);background:var(--purple-lt);color:var(--purple-dk)}
.opt-btn small{display:block;font-weight:500;color:var(--g500);font-size:11px;margin-top:3px}
.form-box{background:var(--g50);border:1px solid var(--g200);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px}
.in{width:100%;padding:9px 11px;border:1px solid var(--g200);border-radius:9px;background:#fff}
.in:focus{outline:none;border-color:var(--purple-md);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
.pbtn{padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;font-weight:800;font-size:13px;text-align:center}
.pbtn:hover{filter:brightness(1.06)}
.pbtn.grn{background:linear-gradient(135deg,#10B981,#059669)}
.pbtn.sec{background:#fff;color:var(--g700);border:1px solid var(--g300)}
.warn-mini{background:#FEF3C7;border:1px solid #FDE68A;border-radius:9px;padding:9px 12px;font-size:12px;color:#92400E;line-height:1.5}
.thumb-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumb-prev img{width:64px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--g200)}

/* 하단 입력 바 */
.composer{padding:12px 16px;background:#fff;border-top:1px solid var(--g200);display:flex;gap:8px;align-items:center}
.composer input{flex:1;padding:11px 14px;border:1.5px solid var(--g200);border-radius:12px;background:var(--g50)}
.composer input:focus{outline:none;border-color:var(--purple-md);background:#fff}
.composer button{padding:11px 18px;border-radius:12px;background:var(--purple);color:#fff;font-weight:800;font-size:13px}
.composer button:hover{background:var(--purple-dk)}

/* 설정 모달 (프록시 URL — API 키 아님) */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal-bg[hidden]{display:none}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
</style>
</head>
<body>

<div class="shell">
  <header class="hdr">
    <div class="hdr-av">🤖</div>
    <div class="hdr-t">
      <h1>고마워톡 AI 캠페인 기획 &amp; 상담 챗봇</h1>
      <p>3분 대화로 신청페이지 · 신청폼 · 자동발송 · 모바일 웹진까지 한 번에 기획합니다</p>
    </div>
    <div class="hdr-r">
      <button class="hdr-btn" id="btn-proxy">⚙️ 프록시 연동</button>
      <button class="hdr-btn" id="btn-reset">🔄 처음부터</button>
    </div>
  </header>

  <div class="prog-wrap">
    <span class="prog-lbl" id="prog-lbl">Step 0 / 5 · 파트너 확인</span>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>

  <div class="qa-tip">
    <span>💡 고마워톡 활용법·카카오 규정·요금제는 대화 중 언제든 편하게 물어보세요!</span>
    <div class="qa-chips">
      <button class="qa-chip" data-ask="Starter와 Pro 요금제 차이가 뭔가요?">요금제 비교</button>
      <button class="qa-chip" data-ask="알림톡과 친구톡 발송 규정 차이를 알려주세요">카카오 규정</button>
      <button class="qa-chip" data-ask="뜰채 조건 분기와 점수 누적은 어떻게 활용하나요?">뜰채 분기</button>
    </div>
  </div>

  <main id="chat"></main>

  <form class="composer" id="composer">
    <input type="text" id="user-input" placeholder="답변을 입력하거나, 궁금한 고마워톡 기능을 질문해 보세요…" autocomplete="off">
    <button type="submit">전송</button>
  </form>
</div>

<!-- Backend_Proxy.gs 웹앱 URL 설정 모달 (API 키 저장 금지) -->
<div class="modal-bg" id="proxy-modal" hidden>
  <div class="modal">
    <h3 style="font-size:15px;color:var(--g900)">⚙️ Backend_Proxy.gs 웹앱 URL 설정</h3>
    <p style="font-size:12px;color:var(--g500);line-height:1.6">보안을 위해 Gemini API 키는 코드에 포함되지 않으며, Google Apps Script 웹앱(<code>Backend_Proxy.gs</code>)을 경유합니다. 비워두면 오프라인/로컬 RAG 모드로 100% 작동합니다.</p>
    <input class="in" id="proxy-input" placeholder="https://script.google.com/macros/s/.../exec">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="pbtn sec" id="proxy-close" type="button">닫기</button>
      <button class="pbtn" id="proxy-save" type="button">저장</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ═══════════════ 로컬 RAG 검색기 (GomawartalkManual.js 기반, file:// 오프라인 100% 동작) ═══════════════ */
const manual = window.GomawartalkManual || window.GOMAWARTALK_MANUAL || [];
const presets = window.IndustryPresets || window.GOMAWARTALK_INDUSTRY_PRESETS || {};
const engineHelper = window.RagInterviewEngine ? new window.RagInterviewEngine({ knowledgeCartridge: manual }) : null;

function isQuestionIntent(text) {
  if (engineHelper && typeof engineHelper._detectQuestionIntent === 'function') {
    return engineHelper._detectQuestionIntent(text);
  }
  return /\?|인가요|되나요|가능|어떻게|얼마|요금|플랜|차이|규정|알려|궁금/.test(text);
}

function searchManualRAG(query) {
  const q = query.toLowerCase();
  const tokens = q.replace(/[^\uAC00-\uD7A3a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length >= 2);
  const scored = manual.map(item => {
    const hay = (item.topic + ' ' + item.content).toLowerCase();
    let score = 0;
    tokens.forEach(tk => {
      if (item.topic.toLowerCase().indexOf(tk) !== -1) score += 4;
      if (hay.indexOf(tk) !== -1) score += 2;
    });
    return { item, score };
  }).sort((a, b) => b.score - a.score);

  const top = scored.filter(x => x.score > 0).slice(0, 2);
  if (!top.length) {
    return '고마워톡 활용 백과사전에서 정확히 일치하는 항목을 찾지 못했어요.\n알림톡/친구톡 규정, Starter vs Pro 요금제, 뜰채 조건 분기, 신청폼 태그·시트, 모바일 웹진 중 궁금한 키워드를 포함해 질문해 주세요!';
  }
  return top.map(t => '📌 ' + t.item.topic + '\n' + t.item.content.trim()).join('\n\n────────────────\n\n');
}

/* ═══════════════ 6대 마스터 트랙 (업종별 번역 카드) ═══════════════ */
const TRACKS = [
  { id: 'TRACK_1', name: '① 일정·행사 리마인드형', desc: '신청 즉시 확인 알림톡 → D-3, D-1, 당일 리마인드로 참석률 극대화' },
  { id: 'TRACK_2', name: '② 쿠폰·자료 발급형', desc: '신청 확인 알림톡(1편 자료) → 채널 추가 유도 → 혜택 쿠폰/심화 자료(친구톡)' },
  { id: 'TRACK_3', name: '③ 정기 칼럼·챌린지 연재형', desc: '회원·모임 등록 확인(알림톡) → 채널 친구 대상 정기 칼럼·소식 연재(친구톡/브랜드메시지)' },
  { id: 'TRACK_4', name: '④ 설문 진단 & 맞춤 분기형', desc: '객관식 설문(5개 이하)으로 태그·시트 부착 → 뜰채 분기 맞춤 처방 발송' },
  { id: 'TRACK_5', name: '⑤ 스탬프·열독 점수 누적형', desc: '시트 정수 더하기로 출석·열독 점수 누적 → VIP 달성 시 자동 보상 발송' },
  { id: 'TRACK_6', name: '⑥ 특수 뷰 (현장 폼 6-A / 종합 관문 6-B)', desc: 'QR 현장 체크인 전용 폼 또는 이미지별 다중 이동 링크 종합 안내 페이지' }
];

/* ═══════════════ 인터뷰 상태 ═══════════════ */
let PROXY_URL = '';
try { PROXY_URL = localStorage.getItem('gmt_bot_proxy') || ''; } catch (e) {}

let ST = {};
function resetState() {
  ST = {
    step: 0,
    owner_name: '', phone: '', channel_name: '', current_plan: 'STARTER',
    mode: 'FULL_SET', quick_sub: '',
    industry_code: 'academy', industry_custom: '',
    track_id: 'TRACK_4',
    target_customer: '', core_offer: '', form_question: '', need_happycall: false, use_webzine: true,
    has_assets: false, logo_base64: null, block_images: {}, pro_upgrade_requested: false
  };
}

function updateProgress() {
  const names = ['파트너 확인', '캠페인 모드', '업종 선택', '마스터 트랙', '핵심 재료 & 웹진', '디자인 에셋 & 제출', '기획 완료'];
  const pct = Math.min(100, Math.round((ST.step / 6) * 100));
  $('#prog-lbl').textContent = 'Step ' + Math.min(ST.step, 5) + ' / 5 · ' + (names[ST.step] || '완료');
  $('#prog-fill').style.width = pct + '%';
}

function addMsg(role, text, opt) {
  opt = opt || {};
  const div = document.createElement('div');
  div.className = 'msg ' + role + (opt.rag ? ' rag' : '');
  const inner = (opt.rag ? '<div class="rag-tag">📚 고마워톡 활용 백과사전 답변</div><br>' : '') + esc(text);
  div.innerHTML = (role === 'bot' ? '<div class="msg-av">🤖</div>' : '') + '<div class="bubble">' + inner + '</div>';
  if (opt.widget) div.querySelector('.bubble').appendChild(opt.widget);
  $('#chat').appendChild(div);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return div;
}

/* ═══════════════ 단계별 프롬프트 렌더러 ═══════════════ */
function showStep(n) {
  ST.step = n; updateProgress();
  if (n === 0) return showStep0();
  if (n === 1) return showStep1();
  if (n === 2) return showStep2();
  if (n === 3) return showStep3();
  if (n === 4) return showStep4();
  if (n === 5) return showStep5();
  if (n === 6) return showComplete();
}

function showStep0() {
  const w = document.createElement('div'); w.className = 'widget';
  w.innerHTML = '<div class="form-box">' +
    '<input class="in" id="s0-name" placeholder="대표님 성함 (예: 장희지)">' +
    '<input class="in" id="s0-phone" placeholder="휴대폰 번호 (예: 010-1234-5678)">' +
    '<input class="in" id="s0-ch" placeholder="카카오 채널명 (예: 장희지 수학학원)">' +
    '<button class="pbtn" id="s0-go" type="button">확인하고 인터뷰 시작하기 →</button></div>';
  addMsg('bot', '안녕하세요! 고마워톡 AI 캠페인 기획 챗봇입니다.\n먼저 대표님 성함과 연락처, 채널명을 알려주시면 현재 플랜에 맞춰 빠르게 안내해 드릴게요.', { widget: w });
  w.querySelector('#s0-go').onclick = () => {
    ST.owner_name = w.querySelector('#s0-name').value.trim() || '파트너 대표님';
    ST.phone = w.querySelector('#s0-phone').value.trim() || '010-0000-0000';
    ST.channel_name = w.querySelector('#s0-ch').value.trim() || (ST.owner_name + ' 채널');
    addMsg('user', ST.owner_name + ' / ' + ST.channel_name + ' (' + ST.phone + ')');
    addMsg('bot', '반갑습니다, ' + ST.owner_name + '님! [' + ST.channel_name + '] 파트너로 확인되었습니다.\n현재 Starter 플랜 기준(영업일 3일 이내 세팅)이며, 마지막 단계에서 Pro 패스트트랙(1일 세팅 + 내 로고 맞춤 알림톡) 신청도 가능합니다.');
    showStep(1);
  };
}

function showStep1() {
  const w = document.createElement('div'); w.className = 'widget';
  w.innerHTML = '<div class="opt-grid">' +
    '<button class="opt-btn" data-m="FULL_SET">🚀 새 캠페인 풀세트 만들기<small>어드민 5대 탭 전체 + 선택형 모바일 웹진 기획</small></button>' +
    '<button class="opt-btn" data-m="QUICK_DATE">⚡ 기존 캠페인 — 날짜발송 1건 추가<small>특정 일시 공지·행사 리마인드 단독 1건</small></button>' +
    '<button class="opt-btn" data-m="QUICK_INTERVAL">⚡ 기존 캠페인 — 간격발송 후속 1건 추가<small>시퀀스 마지막에 후속 메시지 1건 이어붙이기</small></button></div>';
  addMsg('bot', '어떤 방식으로 캠페인을 진행할까요?', { widget: w });
  w.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    ST.mode = b.dataset.m;
    addMsg('user', b.textContent.split('\n')[0]);
    if (ST.mode === 'QUICK_INTERVAL') {
      addMsg('bot', '⚠️ 안내: 간격발송에 후속 1건을 추가하면 이미 기존 마지막 회차까지 수신 완료한 과거 신청자에게는 발송되지 않습니다. 과거 신청자에게도 함께 보내실 수 있도록 날짜발송 병행 가이드를 같이 챙겨드릴게요!');
    }
    showStep(2);
  });
}

    '<input class="in" id="s4-offer" placeholder="신청 시 제공할 핵심 혜택/자료 (예: 오답노트 자료집 + 맞춤 로드맵)">' +

    ST.core_offer = w.querySelector('#s4-offer').value.trim() || (p ? p.tab1_basic_settings.title_30chars : '맞춤 핵심 자료집');

    ST.use_webzine = w.querySelector('#s4-wz').checked;
    addMsg('user', '타겟: ' + ST.target_customer + ' / 혜택: ' + ST.core_offer + ' / 모바일 웹진: ' + (ST.use_webzine ? '함께 제작' : '미사용'));

function showStep5() {
  const w = document.createElement('div'); w.className = 'widget';
  w.innerHTML = '<div class="form-box">' +
    '<div style="font-size:12px;color:var(--g500)">사진을 올리시면 <b>장당 150KB 이하</b>로 자동 압축되어 안전하게 전송됩니다. 자료가 없어도 타이포그래피로 깔끔하게 제작해 드려요!</div>' +
    '<label style="font-size:12.5px;font-weight:700">로고 이미지 (선택): <input type="file" id="s5-logo" accept="image/*"></label>' +
    '<label style="font-size:12.5px;font-weight:700">1단 대표 사진 (선택): <input type="file" id="s5-b1" accept="image/*"></label>' +
    '<div class="thumb-prev" id="s5-prev"></div>' +
    '<label style="font-size:12.5px;font-weight:800;color:#92400E;background:#FFFBEB;padding:9px 11px;border-radius:9px;border:1px solid #FDE68A;display:flex;gap:8px;align-items:center">' +
    '<input type="checkbox" id="s5-pro" style="accent-color:#D97706"> 👑 Pro 플랜 업그레이드 신청 (1일 패스트트랙 + 내 로고 맞춤 알림톡)</label>' +
    '<button class="pbtn grn" id="s5-submit" type="button">🚀 기획 완료 및 CampaignMaster.json 생성</button></div>';
  addMsg('bot', '마지막 단계입니다! 로고나 사진 자료가 있으시면 올려주시고, 완료 버튼을 눌러주세요.', { widget: w });

  async function handleFile(inp, key) {
    const f = inp.files[0]; if (!f) return;
    const url = window.ImageCapturer ? await window.ImageCapturer.compressImageToBase64(f) : await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(f); });
    if (key === 'logo') ST.logo_base64 = url; else ST.block_images[key] = url;
    ST.has_assets = true;
    const img = document.createElement('img'); img.src = url; w.querySelector('#s5-prev').appendChild(img);
  }
  w.querySelector('#s5-logo').onchange = e => handleFile(e.target, 'logo');
  w.querySelector('#s5-b1').onchange = e => handleFile(e.target, 'block_1');
  w.querySelector('#s5-submit').onclick = () => {
    ST.pro_upgrade_requested = w.querySelector('#s5-pro').checked;
    addMsg('user', '자료 준비 완료! (Pro 업그레이드: ' + (ST.pro_upgrade_requested ? '신청' : '유지') + ')');
    showStep(6);
  };
}

/* CampaignMaster.json V2.0 표준 조립 */
function buildCampaignMasterJson() {
  const base = presets[ST.industry_code] || presets.academy;
  const t = new Date(), p2 = n => String(n).padStart(2, '0');
  const ymd = t.getFullYear() + p2(t.getMonth() + 1) + p2(t.getDate());
  const questions = (base.tab3_form && base.tab3_form.questions ? base.tab3_form.questions : []).map((q, idx) => {
    const o = { order: idx + 1, type: q.type, required: !!q.required, question_text: idx === 0 ? ST.form_question : q.question_text };
    if (q.options) o.options = q.options.map(op => ({
      answer_text: op.answer_text,
      actions_after_save: [
        { action_type: 'TAG', operation: 'ATTACH', target: op.tag || '' },
        { action_type: 'SHEET', data_type: 'STRING', operation: 'ATTACH', field_name: op.sheet_field && op.sheet_field.indexOf('.') === -1 ? '고객진단.' + op.sheet_field : (op.sheet_field || '고객진단.항목'), value: op.sheet_value || '' }
      ]
    }));
    return o;
  });
  if (ST.need_happycall && !questions.some(q => q.type === 'PHONE')) {
    questions.push({ order: questions.length + 1, type: 'PHONE', required: true, question_text: '1:1 맞춤 해피콜을 받으실 연락처를 남겨주세요.' });
  }
  const blocks = (base.tab2_landing_blocks || []).map(b => Object.assign({}, b));
  if (blocks[0]) { blocks[0].tag = ST.target_customer; blocks[0].subtitle = ST.core_offer; }

  const seq = (base.tab4_interval_sequence || []).map((it, idx) => ({
    step: it.step || idx + 1,
    timing: it.timing || (idx === 0 ? 'IMMEDIATE' : 'AFTER_1_DAY_0900'),
    template_type: it.template_type || (idx === 0 ? 'ALIMTALK' : 'FREE_FRIENDTALK'),
    template_id: 'f5af8a838d06a71e678e565a513d34a61ffa7b1c',
    branches: [{
      priority: 1,
      condition_desc: it.branch_condition || '모두 (전체 신청자)',
      variables: { '콘텐츠 제목': ST.core_offer + ' 접수 확인', '콘텐츠 소개': it.body_preview || it.note || '신청하신 안내 자료가 준비되었습니다.' },
      sheet_fallback_strings: {},
      image_ratio: '800x400',
      image_copy: { badge: ST.target_customer, headline: ST.core_offer, subtext: ST.channel_name },
      body_text_400chars: it.body_preview || ('#{이름}님! ' + ST.core_offer + ' 핵심 칼럼을 보내드립니다.'),
      buttons: [{ name: '상세 내용 확인하기', link_type: 'WL', webzine_anchor: '#sec-1', url: 'https://gomawartalk.com/webzine/' + ymd + '.html#sec-1' }],
      cards_800x600: [
        { card_index: 1, header_20chars: ST.core_offer.slice(0, 20), body_180chars: ST.target_customer + '을 위한 핵심 로드맵을 확인해 보세요.', button_8chars: '자세히보기', webzine_anchor: '#sec-1', button_url: 'https://gomawartalk.com/webzine/' + ymd + '.html#sec-1' },
        { card_index: 2, header_20chars: '맞춤 상담·신청 안내', body_180chars: '아래 버튼을 눌러 지금 바로 신청하실 수 있습니다.', button_8chars: '신청하기', webzine_anchor: '#sec-cta', button_url: 'https://gomawartalk.com/webzine/' + ymd + '.html#sec-cta' }
      ]
    }]
  }));

  return {
    meta: { schema_version: '2.0', campaign_id: ymd + '_' + ST.channel_name.replace(/\s+/g, '') + '_01', created_at: t.toISOString(), mode: ST.mode, use_webzine: ST.use_webzine, webzine_base_url: 'https://gomawartalk.com/webzine/' + ymd + '.html' },
    partner_info: { owner_name: ST.owner_name, phone: ST.phone, channel_name: ST.channel_name, channel_id_num: '', current_plan: ST.current_plan, pro_upgrade_requested: ST.pro_upgrade_requested, industry_code: ST.industry_code, track_id: ST.track_id },
    brand_assets: { primary_color: '#4F46E5', secondary_color: '#EEF2FF', logo_base64: ST.logo_base64, block_images_base64: { block_1: ST.block_images.block_1 || null, block_2: null, block_3: null, block_4: null, block_5: null } },
    tab1_basic_settings: Object.assign({}, base.tab1_basic_settings, { title_30chars: ('[신청] ' + ST.core_offer).slice(0, 30) }),
    tab2_landing_content: { output_mode: 'FULL', bg_color: '#F8FAFC', use_shorts_landing: false, shorts_youtube_url: '', blocks_1000px: blocks },
    tab3_application_form: { is_active: true, form_title: base.tab3_form ? base.tab3_form.form_title : '맞춤 자료 발송 설문', form_guide_text: '정확한 맞춤 자료 발송을 위해 아래 항목을 선택해 주세요.', questions: questions },
    tab4_interval_messages: { quick_single_mode: ST.mode === 'QUICK_INTERVAL', exclude_days: ['SAT', 'SUN'], sequence: seq },
    tab5_date_messages: [{ quick_single_mode: ST.mode === 'QUICK_DATE', send_datetime: ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8) + ' 10:00', title: ST.core_offer + ' D-Day 안내', template_type: 'BRAND_CAROUSEL', branches: [seq[0] ? seq[0].branches[0] : {}] }],
    webzine_studio: ST.use_webzine ? { webzine_title: ST.channel_name + ' 모바일 매거진', sections: [{ anchor_id: 'sec-1', type: 'ARTICLE_CARD', badge: 'PART 01', title: '1. ' + ST.core_offer, body: ST.target_customer + '을 위한 핵심 요약 가이드입니다.' }, { anchor_id: 'sec-cta', type: 'FLOATING_CTA', button_text: '지금 바로 상담 신청하기', link: 'https://gomawartalk.com' }] } : null
  };
}

function showComplete() {
  const payload = buildCampaignMasterJson();
  const w = document.createElement('div'); w.className = 'widget';
  w.innerHTML = '<div class="form-box">' +
    '<div style="font-size:12.5px;color:var(--green);font-weight:800">✅ CampaignMaster.json V2.0 표준 데이터가 완성되었습니다!</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="pbtn" id="dl-json" type="button" style="flex:1">💾 로컬 JSON 다운로드 (조종석에서 바로 열기)</button>' +
    '<button class="pbtn grn" id="send-proxy" type="button" style="flex:1">🚀 제작 요청 제출하기 (클라우드 전송)</button></div>' +
    '<div id="submit-status" style="font-size:12px;color:var(--g500)"></div></div>';
  addMsg('bot', ST.owner_name + '님, 수고하셨습니다! [' + ST.channel_name + '] 맞춤 캠페인 기획안이 완성되었습니다.\n로컬 JSON으로 바로 저장해 LandingBuilder.html에서 열어보거나, 클라우드로 제출하실 수 있습니다.', { widget: w });

  w.querySelector('#dl-json').onclick = () => {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'CampaignMaster_' + ST.channel_name.replace(/[\\\/:*?"<>|\s]+/g, '_') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  w.querySelector('#send-proxy').onclick = async () => {
    const st = w.querySelector('#submit-status');
    if (!PROXY_URL) {
      st.innerHTML = '⚠️ 상단 [⚙️ 프록시 연동]에서 Backend_Proxy.gs 웹앱 URL을 설정하면 구글 드라이브 적재 + 대표님 구글 챗 즉시 알림이 실행됩니다. (지금은 [💾 로컬 JSON 다운로드]로 테스트하세요!)';
      return;
    }
    st.textContent = '전송 중…';
    try {
      const res = await fetch(PROXY_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_campaign', payload }) });
      const data = await res.json();
      st.innerHTML = '🎉 제출 완료! 담당 대표님께 구글 챗 즉시 알림이 발송되었습니다. (' + esc(data.fileName || '저장됨') + ')';
    } catch (err) { st.textContent = '❌ 전송 실패: ' + err.message; }
  };
}

/* ═══════════════ 자유 입력 처리 (Intent Routing: RAG Q&A ↔ 인터뷰 복귀) ═══════════════ */
async function handleUserText(text) {
  const t = text.trim(); if (!t) return;
  addMsg('user', t);

  if (isQuestionIntent(t)) {
    let ans = '';
    if (PROXY_URL) {
      try {
        const res = await fetch(PROXY_URL, { method: 'POST', body: JSON.stringify({ action: 'chat', mode: 'QA', userText: t }) });
        const d = await res.json(); ans = d.reply || d.text || searchManualRAG(t);
      } catch (e) { ans = searchManualRAG(t); }
    } else {
      ans = searchManualRAG(t);
    }
    addMsg('bot', ans + '\n\n────────────────\n💬 궁금증이 해결되셨나요? 다시 진행하던 Step ' + Math.min(ST.step, 5) + ' 단계로 돌아가 이어서 진행해 주세요!', { rag: true });
    return;
  }

  // 업종 단계에서 자유 입력한 경우
  if (ST.step === 2) {
    ST.industry_custom = t; ST.industry_code = 'pro_ngo_church';
    addMsg('bot', '[' + t + '] 업종으로 맞춤 반영했습니다! 이어서 운영 트랙을 선택해 주세요.');
    return showStep(3);
  }
  addMsg('bot', '말씀하신 내용("' + t + '")을 기획 메모에 기록해 두었습니다! 위 카드 버튼을 눌러 다음 단계로 넘어가거나, 궁금한 고마워톡 기능을 질문해 주세요.');
}

/* 이벤트 바인딩 */
$('#composer').addEventListener('submit', e => { e.preventDefault(); const v = $('#user-input').value; $('#user-input').value = ''; handleUserText(v); });
document.addEventListener('click', e => { const q = e.target.closest('[data-ask]'); if (q) handleUserText(q.dataset.ask); });
$('#btn-reset').onclick = () => { $('#chat').innerHTML = ''; resetState(); showStep(0); };
$('#btn-proxy').onclick = () => { $('#proxy-input').value = PROXY_URL; $('#proxy-modal').hidden = false; };
$('#proxy-close').onclick = () => { $('#proxy-modal').hidden = true; };
$('#proxy-save').onclick = () => { PROXY_URL = $('#proxy-input').value.trim(); try { localStorage.setItem('gmt_bot_proxy', PROXY_URL); } catch (e) {} $('#proxy-modal').hidden = true; };

window.BOT = { state: () => ST, buildCampaignMasterJson, searchManualRAG, isQuestionIntent, showStep };
resetState();
showStep(0);
})();
</script>
